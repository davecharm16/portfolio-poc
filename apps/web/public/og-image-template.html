<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <title>OG Image - Dave Charm Bulaquena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 100%);
            position: relative;
        }

        .gradient-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            background: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 100%);
            opacity: 0.15;
            border-radius: 0 0 0 50%;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 60px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 40px;
        }

        .profile-photo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
            background: linear-gradient(135deg, #8B5CF6, #3B82F6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }

        .profile-info {
            flex: 1;
        }

        .name {
            font-size: 64px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1.1;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .role {
            font-size: 36px;
            font-weight: 500;
            color: #E5E5E5;
            line-height: 1.3;
        }

        .skills-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 36px;
        }

        .skill-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: 600;
            color: #FFFFFF;
            white-space: nowrap;
        }

        .stats-section {
            display: flex;
            gap: 48px;
            align-items: center;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            color: #A3A3A3;
        }

        .stat-icon {
            font-size: 28px;
        }

        .stat-value {
            font-weight: 700;
            color: #FFFFFF;
        }

        .website {
            position: absolute;
            bottom: 60px;
            right: 60px;
            font-size: 22px;
            font-weight: 500;
            color: #A3A3A3;
        }
    </style>
</head>
<body>
    <div class="gradient-overlay"></div>
    <div class="container">
        <div class="profile-section">
            <div class="profile-photo">
                DC
            </div>
            <div class="profile-info">
                <div class="name">DAVE CHARM<br>BULAQUENA</div>
                <div class="role">Full Stack Developer &<br>Solutions Designer</div>
            </div>
        </div>

        <div class="skills-section">
            <div class="skill-badge">React</div>
            <div class="skill-badge">TypeScript</div>
            <div class="skill-badge">Node.js</div>
            <div class="skill-badge">Tailwind CSS</div>
            <div class="skill-badge">PostgreSQL</div>
            <div class="skill-badge">AWS</div>
            <div class="skill-badge">Docker</div>
            <div class="skill-badge">Strapi</div>
        </div>

        <div class="stats-section">
            <div class="stat">
                <span class="stat-icon">⭐</span>
                <span><span class="stat-value">15+</span> Projects</span>
            </div>
            <div class="stat">
                <span class="stat-icon">📊</span>
                <span><span class="stat-value">5+</span> Years</span>
            </div>
            <div class="stat">
                <span class="stat-icon">🎓</span>
                <span class="stat-value">Certified</span>
            </div>
        </div>
    </div>

    <div class="website">davebulaquena.com</div>
</body>
</html>
